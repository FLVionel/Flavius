<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background circle - felt green -->
  <defs>
    <radialGradient id="bgGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1a6b3e"/>
      <stop offset="100%" stop-color="#0a3d20"/>
    </radialGradient>
    <radialGradient id="ballGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </radialGradient>
    <radialGradient id="goldGrad" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </radialGradient>
    <radialGradient id="redGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#e85050"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer circle background -->
  <circle cx="128" cy="128" r="124" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Outer border gold -->
  <circle cx="128" cy="128" r="124" fill="none" stroke="#c9a84c" stroke-width="6"/>
  <!-- Inner subtle border -->
  <circle cx="128" cy="128" r="116" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Billiard cue stick (diagonal) -->
  <rect x="30" y="22" width="10" height="140" rx="5"
        transform="rotate(38, 85, 92)"
        fill="#d4a855" stroke="#a07830" stroke-width="1.5"/>
  <!-- Cue tip -->
  <rect x="30" y="22" width="10" height="18" rx="3"
        transform="rotate(38, 85, 92)"
        fill="#5b8fc9"/>

  <!-- Billiard ball 8 (black, center-left) -->
  <circle cx="100" cy="148" r="36" fill="#1a1a1a" filter="url(#shadow)"/>
  <circle cx="100" cy="148" r="36" fill="none" stroke="#444" stroke-width="1.5"/>
  <!-- White circle on 8-ball -->
  <circle cx="100" cy="148" r="16" fill="white"/>
  <!-- Number 8 -->
  <text x="100" y="155" text-anchor="middle" font-family="Arial Black, sans-serif"
        font-size="20" font-weight="900" fill="#1a1a1a">8</text>
  <!-- Highlight on 8-ball -->
  <circle cx="90" cy="136" r="8" fill="white" opacity="0.25"/>

  <!-- Playing cards (top right, fanned) -->
  <!-- Card 3 (back, rightmost) -->
  <rect x="152" y="70" width="58" height="80" rx="7"
        transform="rotate(18, 181, 110)"
        fill="#1a4a9e" stroke="#c9a84c" stroke-width="2"/>
  <!-- Card pattern lines on back -->
  <rect x="158" y="77" width="46" height="66" rx="4"
        transform="rotate(18, 181, 110)"
        fill="none" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Card 2 (middle) -->
  <rect x="148" y="68" width="58" height="80" rx="7"
        transform="rotate(7, 177, 108)"
        fill="white" stroke="#888" stroke-width="1.5"/>
  <!-- Card 2 content - red heart -->
  <text x="158" y="90" font-family="Arial, sans-serif" font-size="16"
        font-weight="700" fill="#c0392b"
        transform="rotate(7, 177, 108)">A</text>
  <text x="172" y="90" font-family="Arial, sans-serif" font-size="14"
        fill="#c0392b"
        transform="rotate(7, 177, 108)">♥</text>

  <!-- Card 1 (front, leftmost) -->
  <rect x="140" y="65" width="58" height="80" rx="7"
        transform="rotate(-4, 169, 105)"
        fill="white" stroke="#888" stroke-width="1.5"/>
  <!-- Card 1 content - black spade -->
  <text x="148" y="88" font-family="Arial, sans-serif" font-size="16"
        font-weight="700" fill="#1a1a1a"
        transform="rotate(-4, 169, 105)">A</text>
  <text x="162" y="88" font-family="Arial, sans-serif" font-size="14"
        fill="#1a1a1a"
        transform="rotate(-4, 169, 105)">♠</text>
  <!-- Big spade center of front card -->
  <text x="169" y="128" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="30" fill="#1a1a1a"
        transform="rotate(-4, 169, 105)">♠</text>

  <!-- Gold stars / dots decoration -->
  <circle cx="60" cy="90" r="4" fill="#c9a84c" opacity="0.7"/>
  <circle cx="75" cy="75" r="3" fill="#c9a84c" opacity="0.5"/>
  <circle cx="190" cy="175" r="4" fill="#c9a84c" opacity="0.6"/>
  <circle cx="175" cy="190" r="3" fill="#c9a84c" opacity="0.4"/>

  <!-- Bottom text: BP -->
  <text x="128" y="218" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="22" font-weight="900" letter-spacing="6"
        fill="#c9a84c">BILIARD</text>
  <text x="128" y="240" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="18" font-weight="900" letter-spacing="8"
        fill="#e8c76a" opacity="0.85">POKER</text>
</svg>
