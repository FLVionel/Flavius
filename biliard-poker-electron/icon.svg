<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGrad" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e7a47"/>
      <stop offset="100%" stop-color="#0a3d20"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="128" cy="128" r="124" fill="url(#bgGrad)"/>
  <circle cx="128" cy="128" r="124" fill="none" stroke="#c9a84c" stroke-width="7"/>
  <circle cx="128" cy="128" r="115" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- ===== CARDS (right side) ===== -->
  <!-- Card back (furthest) -->
  <rect x="134" y="52" width="72" height="98" rx="8"
        transform="rotate(15, 170, 101)"
        fill="#1a3a8a" stroke="#c9a84c" stroke-width="2.5"/>
  <rect x="140" y="58" width="60" height="86" rx="5"
        transform="rotate(15, 170, 101)"
        fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Card middle -->
  <rect x="126" y="48" width="72" height="98" rx="8"
        transform="rotate(5, 162, 97)"
        fill="white" stroke="#bbb" stroke-width="2"/>

  <!-- Card front (main - AS DE ROSU mare) -->
  <rect x="116" y="44" width="72" height="98" rx="8"
        fill="white" stroke="#999" stroke-width="2" filter="url(#shadow)"/>
  <!-- A top-left -->
  <text x="126" y="70" font-family="Arial Black, sans-serif"
        font-size="22" font-weight="900" fill="#cc1111">A</text>
  <text x="127" y="90" font-family="Arial, sans-serif"
        font-size="20" fill="#cc1111">♥</text>
  <!-- Big heart center -->
  <text x="152" y="112" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="52" fill="#cc1111">♥</text>
  <!-- A bottom-right (rotated) -->
  <text x="178" y="132" text-anchor="middle" font-family="Arial Black, sans-serif"
        font-size="22" font-weight="900" fill="#cc1111"
        transform="rotate(180, 178, 132)">A</text>

  <!-- ===== BILLIARD BALL 8 (left side) ===== -->
  <circle cx="90" cy="152" r="46" fill="#111111" filter="url(#shadow)"/>
  <circle cx="90" cy="152" r="46" fill="none" stroke="#444" stroke-width="2"/>
  <!-- White circle -->
  <circle cx="90" cy="152" r="20" fill="white"/>
  <!-- Number 8 -->
  <text x="90" y="160" text-anchor="middle" font-family="Arial Black, sans-serif"
        font-size="24" font-weight="900" fill="#111">8</text>
  <!-- Shine -->
  <ellipse cx="78" cy="136" rx="11" ry="7" fill="white" opacity="0.22" transform="rotate(-30,78,136)"/>

  <!-- ===== BOTTOM TEXT ===== -->
  <!-- Dark bar for contrast -->
  <rect x="10" y="207" width="236" height="42" rx="6" fill="rgba(0,0,0,0.55)"/>
  <!-- BILIARD -->
  <text x="128" y="228" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="21" font-weight="900" letter-spacing="5"
        fill="white" filter="url(#textShadow)">BILIARD</text>
  <!-- POKER -->
  <text x="128" y="246" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="18" font-weight="900" letter-spacing="9"
        fill="#f0c040" filter="url(#textShadow)">POKER</text>
</svg>
