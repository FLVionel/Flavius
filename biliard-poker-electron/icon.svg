<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background dark gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <!-- 8-ball gradient (3D sphere) -->
    <radialGradient id="ballGrad" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="40%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- White circle on 8-ball -->
    <radialGradient id="whiteCircle" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </radialGradient>

    <!-- Ball shine/reflection -->
    <radialGradient id="shine" cx="35%" cy="25%" r="45%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <filter id="dropShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="textGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- ===== OUTER GOLD RING ===== -->
  <circle cx="128" cy="128" r="122" fill="#c9a84c"/>
  <!-- Inner gold ring thin -->
  <circle cx="128" cy="128" r="108" fill="#c9a84c"/>
  <!-- Black fill -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)"/>
  <!-- Inner ring border -->
  <circle cx="128" cy="128" r="107" fill="none" stroke="#c9a84c" stroke-width="2.5"/>

  <!-- ===== 8-BALL (center, large) ===== -->
  <circle cx="138" cy="138" r="70" fill="url(#ballGrad)" filter="url(#dropShadow)"/>
  <!-- White oval on ball -->
  <ellipse cx="138" cy="138" rx="28" ry="26" fill="url(#whiteCircle)"/>
  <!-- Number 8 -->
  <text x="138" y="147" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="30" font-weight="900" fill="#111">8</text>
  <!-- Shine highlight top-left of ball -->
  <ellipse cx="116" cy="112" rx="22" ry="15"
           transform="rotate(-30, 116, 112)"
           fill="url(#shine)"/>
  <!-- Secondary small shine -->
  <ellipse cx="124" cy="107" rx="10" ry="6"
           transform="rotate(-20, 124, 107)"
           fill="rgba(255,255,255,0.35)"/>

  <!-- ===== ACE OF HEARTS CARD (top-left, overlapping) ===== -->
  <!-- Card shadow -->
  <rect x="18" y="14" width="80" height="108" rx="9"
        fill="rgba(0,0,0,0.5)" transform="translate(4,5)"/>
  <!-- Card body -->
  <rect x="18" y="14" width="80" height="108" rx="9"
        fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#cardShadow)"/>
  <!-- Top-left A♥ -->
  <text x="30" y="42" font-family="Arial Black, sans-serif"
        font-size="26" font-weight="900" fill="#cc1111">A</text>
  <text x="31" y="64" font-family="Arial, sans-serif"
        font-size="22" fill="#cc1111">♥</text>
  <!-- Big heart center -->
  <text x="58" y="98" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="50" fill="#cc1111">♥</text>
  <!-- Bottom-right A♥ rotated -->
  <text x="86" y="112" text-anchor="middle" font-family="Arial Black, sans-serif"
        font-size="22" font-weight="900" fill="#cc1111"
        transform="rotate(180, 86, 104)">A</text>
  <text x="86" y="90" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="#cc1111"
        transform="rotate(180, 86, 90)">♥</text>

  <!-- ===== BILIARD POKER TEXT ===== -->
  <!-- Dark bar behind text for contrast -->
  <rect x="20" y="210" width="216" height="38" rx="5"
        fill="rgba(0,0,0,0.65)"/>
  <!-- BILIARD -->
  <text x="128" y="232" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="24" font-weight="900" letter-spacing="3"
        fill="white" filter="url(#textGlow)">BILIARD</text>
  <!-- POKER -->
  <text x="128" y="244" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="20" font-weight="900" letter-spacing="8"
        fill="white" filter="url(#textGlow)">POKER</text>
</svg>
